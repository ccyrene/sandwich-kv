[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandwich-kv"
version = "0.1.0"
description = "Layer-asymmetric mixed precision + residual vector quantization for KV-cache compression in reasoning-distilled LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rungrod Thongjampa" }]
keywords = ["llm", "kv-cache", "quantization", "compression", "turboquant", "lloyd-max"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "transformers>=4.40",
    "datasets>=2.14",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/ccyrene/sandwich-kv"
Paper = "https://arxiv.org/abs/TBD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
